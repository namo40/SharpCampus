name: sharpcampus

services:
  redis:
    image: redis:7-alpine

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/ApiServer.Dockerfile
    image: sharpcampus-apiserver
    depends_on:
      - redis
    # A server that comes up before Redis does exits; coming back is how it waits.
    restart: unless-stopped
    # Supabase is the developer's own stack on the host, not part of this project.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - Kestrel__Endpoints__Grpc__Url=http://0.0.0.0:5001
      - Kestrel__Endpoints__Web__Url=http://0.0.0.0:5011
      - Redis__ConnectionString=redis:6379
      - Database__ConnectionString=Host=host.docker.internal;Port=54322;Username=postgres;Password=postgres;Database=postgres
      - Supabase__Url=http://host.docker.internal:54321
      # Where the token comes from is not what the token says: it is signed by the stack as the host
      # reaches it.
      - Supabase__IssuerUrl=http://127.0.0.1:54321
      - EntryToken__Secret=sharpcampus-compose-entry-token-secret
      - BotFallback__ControlEndpoint=http://bot:5003
      - BotFallback__SummonAfterSeconds=15

  room-1:
    build:
      context: ../..
      dockerfile: deploy/docker/RoomServer.Dockerfile
    image: sharpcampus-roomserver
    depends_on:
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - Kestrel__Endpoints__Grpc__Url=http://0.0.0.0:5002
      - Kestrel__Endpoints__Web__Url=http://0.0.0.0:5012
      - Redis__ConnectionString=redis:6379
      - Database__ConnectionString=Host=host.docker.internal;Port=54322;Username=postgres;Password=postgres;Database=postgres
      - Supabase__Url=http://host.docker.internal:54321
      - Supabase__IssuerUrl=http://127.0.0.1:54321
      - EntryToken__Secret=sharpcampus-compose-entry-token-secret
      # The registry entry, the Envoy cluster and this container's DNS name are all this one name.
      - RoomServer__Name=room-1
      # The address a ticket prints is for clients outside: the bot inside overrides it with the entry
      # point's internal name.
      - RoomServer__ClientEndpoint=http://localhost:5000
      - RoomServer__ControlEndpoint=http://room-1:5002

  # The second instance is the same image with a different name: nothing about a room server is
  # singular.
  room-2:
    image: sharpcampus-roomserver
    depends_on:
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - Kestrel__Endpoints__Grpc__Url=http://0.0.0.0:5002
      - Kestrel__Endpoints__Web__Url=http://0.0.0.0:5012
      - Redis__ConnectionString=redis:6379
      - Database__ConnectionString=Host=host.docker.internal;Port=54322;Username=postgres;Password=postgres;Database=postgres
      - Supabase__Url=http://host.docker.internal:54321
      - Supabase__IssuerUrl=http://127.0.0.1:54321
      - EntryToken__Secret=sharpcampus-compose-entry-token-secret
      - RoomServer__Name=room-2
      - RoomServer__ClientEndpoint=http://localhost:5000
      - RoomServer__ControlEndpoint=http://room-2:5002

  bot:
    build:
      context: ../..
      dockerfile: deploy/docker/BotServer.Dockerfile
    image: sharpcampus-botserver
    depends_on:
      - envoy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - Kestrel__Endpoints__Grpc__Url=http://0.0.0.0:5003
      - Kestrel__Endpoints__Web__Url=http://0.0.0.0:5013
      # A bot is a client, so it comes in through the front door like one.
      - BotServer__ApiServerAddress=http://envoy:5000
      - BotServer__RoomEndpointOverride=http://envoy:5000
      - BotServer__SupabaseAuthUrl=http://host.docker.internal:54321
      # Must stay below the ApiServer's BotFallback__SummonAfterSeconds: a bot that gave up waiting has
      # to be out of the queue before it becomes the lone waiting account and draws a bot of its own.
      # The two live in different processes, so nothing at startup can check this.
      - BotServer__QueueTimeoutSeconds=10

  # The only way in. No server port above is published, so a client reaches a room server only by
  # asking for one by name.
  envoy:
    image: envoyproxy/envoy:v1.38.3
    depends_on:
      - api
      - room-1
      - room-2
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "5000:5000"
      # The admin interface answers more than anything outside this machine should ask.
      - "127.0.0.1:9901:9901"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles:
      - observability
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # 9090 itself sits inside a Windows excluded port range on a Hyper-V host.
      - "19090:9090"
