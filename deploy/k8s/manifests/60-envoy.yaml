apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: sharpcampus
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

    static_resources:
      listeners:
        - name: client_ingress
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 5000
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: client_ingress
                    # A gRPC client opens h2c with prior knowledge, without an upgrade to negotiate.
                    codec_type: AUTO
                    route_config:
                      name: sharpcampus
                      virtual_hosts:
                        - name: sharpcampus
                          domains:
                            - "*"
                          routes:
                            # Only gRPC passes. The servers map their operations routes onto the same
                            # pipeline their gRPC port serves, so anything else forwarded here would reach
                            # /metrics through the front door.
                            - name: duel_room
                              match:
                                prefix: /
                                headers:
                                  - name: room-id
                                    present_match: true
                                  - name: content-type
                                    string_match:
                                      prefix: application/grpc
                              route:
                                # Named by the header the Lua filter resolved the room into.
                                cluster_header: x-room-server
                                # A duel stream lives as long as the match does. Heartbeats keep it clear of
                                # the idle timeout, but any duration cap would end it mid-match.
                                timeout: 0s
                                max_stream_duration:
                                  max_stream_duration: 0s
                                  grpc_timeout_header_max: 0s
                            - name: meta
                              match:
                                prefix: /
                                headers:
                                  - name: content-type
                                    string_match:
                                      prefix: application/grpc
                              route:
                                cluster: api
                            - name: not_grpc
                              match:
                                prefix: /
                              direct_response:
                                status: 404
                    http_filters:
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              -- Which server owns a room is asked once per stream, as the client connects,
                              -- never per message.
                              function envoy_on_request(handle)
                                local room = handle:headers():get("room-id")
                                if not room then
                                  return
                                end

                                local headers, body = handle:httpCall(
                                  "api-ops",
                                  {
                                    [":method"] = "GET",
                                    [":path"] = "/internal/rooms/" .. room .. "/location",
                                    [":authority"] = "api-ops",
                                  },
                                  nil,
                                  1000)

                                local status = headers and headers[":status"]
                                if status == "200" and body then
                                  handle:headers():replace("x-room-server", body:match("^%s*(.-)%s*$"))
                                elseif status == "404" then
                                  handle:respond({[":status"] = "404"}, "unknown room")
                                else
                                  handle:respond({[":status"] = "503"}, "room lookup failed")
                                end
                              end
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: api
          # A replaced pod is a new address under the same name. Envoy re-resolves every 5s by default,
          # on its own clock rather than on the cluster DNS record's much longer TTL, so a rollout is
          # followed instead of cached through.
          type: STRICT_DNS
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: api
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          # The headless service resolves to every api pod, so the round robin above is
                          # over pods rather than over one virtual address.
                          address: api.sharpcampus.svc.cluster.local
                          port_value: 5001

        # These two names are load-bearing: the resolver answers with the name a room server registered
        # under, cluster_header picks the cluster by exactly that, and a StatefulSet is what makes a pod
        # keep the name across a restart.
        - name: room-0
          type: STRICT_DNS
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: room-0
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: room-0.room.sharpcampus.svc.cluster.local
                          port_value: 5002

        - name: room-1
          type: STRICT_DNS
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: room-1
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: room-1.room.sharpcampus.svc.cluster.local
                          port_value: 5002

        # The operations port of the same server the `api` cluster points at, and the only HTTP/1 upstream
        # here: the room lookup is a plain GET, not a gRPC call.
        - name: api-ops
          type: STRICT_DNS
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http_protocol_options: {}
          load_assignment:
            cluster_name: api-ops
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: api.sharpcampus.svc.cluster.local
                          port_value: 5011

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: sharpcampus
  labels:
    app: envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.38.3
          ports:
            - name: client
              containerPort: 5000
          volumeMounts:
            - name: config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: envoy-config

---
# The only way in. No server above is reachable from outside the cluster, so a client reaches a room
# server only by asking for one by name. The admin interface stays on 9901 with no service in front of
# it: it answers more than anything outside this pod should ask.
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: sharpcampus
  labels:
    app: envoy
spec:
  type: NodePort
  selector:
    app: envoy
  ports:
    - name: client
      port: 5000
      targetPort: client
      nodePort: 30500
